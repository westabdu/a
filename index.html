    <script>
      // Gracefully handle any dev environment sandbox WebSocket connection drops
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('vite') || e.message.includes('createWebSocketModuleRunnerTransport'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && String(e.reason).includes('WebSocket')) {
          e.stopImmediatePropagation();
        }
      });
    </script>
